<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Movie Calendar</title>
		<style>
			body{margin:0;background:#111;color:#eee;font-family:Arial}
			header{padding:12px;background:#181818;position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:12px}
			#lastUpdated{color:#888;font-size:12px;white-space:nowrap}
			#grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:10px}
			.day{background:#1f1f1f;border-radius:8px;padding:8px;min-height:0}
			.date{font-weight:bold}
			.posters{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;margin-top:8px;align-content:start}
			.poster{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:4px;cursor:pointer;display:block}
			.poster-fallback{display:flex;align-items:center;justify-content:center;text-align:center;background:#2a2a2a;color:#fff;font-size:10px;font-weight:bold;line-height:1.2;overflow:hidden;min-height:90px;border-radius:4px}
			.planning-toggle{padding:6px 12px;border:1px solid #444;background:#2a2a2a;color:#eee;border-radius:6px;cursor:pointer;white-space:nowrap}
			.planning-toggle.active{background:#2a6bf6;border-color:#2a6bf6}
			.week-count{font-weight:normal;font-size:11px;color:#2a6bf6}
			.week-count.full{color:#f90}
			#grid.planning-mode .poster,#grid.planning-mode .poster-fallback{filter:grayscale(1) opacity(0.45);transition:filter .15s,box-shadow .15s}
			#grid.planning-mode .poster.selected,#grid.planning-mode .poster-fallback.selected{filter:none;box-shadow:0 0 0 3px #2a6bf6}
			@keyframes limitFlash{0%,100%{box-shadow:0 0 0 3px #c33}50%{box-shadow:0 0 0 3px transparent}}
			.limit-flash{animation:limitFlash .25s ease-in-out 2}
			#modal{display:none;position:fixed;inset:0;background:#000a;align-items:center;justify-content:center;z-index:10000}
			#content{background:#222;max-width:900px;width:95%;padding:18px;border-radius:10px;display:grid;grid-template-columns:220px 1fr;gap:16px;max-height:90vh;overflow:auto}
				.badge{display:inline-block;background:#444;padding:3px 7px;border-radius:99px;margin:2px}
				.show-badge{cursor:pointer;background:#2a6bf6;color:#fff;padding:6px 8px;border-radius:6px;margin:3px;display:inline-block}
				.show-badge.sold{background:#a33}
				.show-tooltip{position:absolute;background:#222;border:1px solid #444;padding:8px;border-radius:6px;color:#ddd;z-index:11001;min-width:200px;box-shadow:0 6px 18px rgba(0,0,0,0.6)}
			small{color:#bbb}
			.seatmap-hover{position:fixed;bottom:20px;right:20px;background:#222;border:1px solid #444;border-radius:10px;max-width:400px;z-index:9999;overflow:auto;max-height:80vh}
			.seatmap-hover .seat-detail{padding:0}
			.seat{width:12px;height:12px;border-radius:2px;display:inline-block}
			.seat--empty{background:#444}
			.seat--available{background:#0f9}
			.seat--booked{background:#f90}
			.row-label{font-size:11px;width:15px;text-align:center}
			.seat-line{display:flex;gap:2px}
			.screen{text-align:center;font-size:10px;margin:4px 0;color:#bbb}
			.front-label{text-align:left;font-size:10px;margin:4px 0;color:#bbb}
			.seat-legend{font-size:10px;margin-top:8px;padding:4px;text-align:left;color:#bbb}
			.seat-rows{display:flex;flex-direction:column}
			.seat-row{display:flex;gap:2px;margin:2px 0;align-items:center;justify-content:flex-start}
			#filters{padding:12px;background:#181818;display:flex;flex-direction:column;gap:8px}
			.filter-group{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
			.filter-label{color:#888;font-size:12px;min-width:52px}
			.filter-btn{padding:6px 12px;border:1px solid #444;background:#2a2a2a;color:#eee;border-radius:6px;cursor:pointer}
			.filter-btn.active{background:#2a6bf6;border-color:#2a6bf6}
			.filter-select-all{border-style:dashed}
			.filter-slider{accent-color:#2a6bf6;width:160px;vertical-align:middle}
			.filter-slider-value{color:#eee;font-size:12px;min-width:48px;display:inline-block}
		</style>
	</head>
	<body>
		<header>
			<span id="status" style="margin-left:12px"></span>
			<div style="display:flex;gap:12px;align-items:center">
				<button id="planningToggle" class="planning-toggle" onclick="togglePlanningMode()">A-List Plan Mode</button>
				<span id="lastUpdated"></span>
			</div>
		</header>
		<div id="filters"></div>

		<main>
			<div id="grid"></div>
		</main>

		<div id="modal" onclick="if(event.target===this)closeModal()">
			<div id="content"></div>
		</div>

		<script>
			// Frontend reads the generated movies.json and local posters in the same folder.
			const STATUS = document.getElementById('status');
			const LAST_UPDATED = document.getElementById('lastUpdated');
			const GRID = document.getElementById('grid');
			const MODAL = document.getElementById('modal');
			const CONTENT = document.getElementById('content');
			let allMovies = [];

			function movieKey(movie) {
				return `${movie.title}::${movie.release_year || ''}::${movie.movie_id || ''}`;
			}

			function formatLastUpdated(iso) {
				if (!iso) return '';
				const d = new Date(iso);
				if (isNaN(d)) return '';
				return 'Updated ' + d.toLocaleString([], {month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'});
			}

			function closeModal() {
				// hide modal and remove any tooltips
				MODAL.style.display = 'none';
				document.querySelectorAll('.show-tooltip').forEach(el => el.remove());
			}

			// A-List planning mode: greys out every poster except the ones you've
			// picked, so a week's plan pops visually. Up to 4 picks per week/row.
			let planningMode = false;
			let posterWeekMap = {};
			let selectedPosters = loadSelections();

			function loadSelections() {
				try {
					const raw = localStorage.getItem('alistSelections');
					if (raw) return new Set(JSON.parse(raw));
				} catch (e) {}
				return new Set();
			}

			function saveSelections() {
				try {
					localStorage.setItem('alistSelections', JSON.stringify(Array.from(selectedPosters)));
				} catch (e) {}
			}

			function togglePlanningMode() {
				planningMode = !planningMode;
				GRID.classList.toggle('planning-mode', planningMode);
				document.getElementById('planningToggle').classList.toggle('active', planningMode);
				updateWeekCounts();
			}

			function countSelectedInWeek(week) {
				let n = 0;
				selectedPosters.forEach(key => { if (posterWeekMap[key] === week) n++; });
				return n;
			}

			function updateWeekCounts() {
				const counts = {};
				selectedPosters.forEach(key => {
					const week = posterWeekMap[key];
					if (week === undefined) return;
					counts[week] = (counts[week] || 0) + 1;
				});
				document.querySelectorAll('.week-count').forEach(span => {
					const week = Number(span.dataset.week);
					const n = counts[week] || 0;
					span.textContent = planningMode ? `${n}/4` : '';
					span.classList.toggle('full', n >= 4);
				});
			}

			function flashPosterLimit(el) {
				el.classList.add('limit-flash');
				setTimeout(() => el.classList.remove('limit-flash'), 500);
			}

			function togglePosterSelection(el, key, week) {
				if (selectedPosters.has(key)) {
					selectedPosters.delete(key);
					el.classList.remove('selected');
				} else {
					if (countSelectedInWeek(week) >= 4) {
						flashPosterLimit(el);
						return;
					}
					selectedPosters.add(key);
					el.classList.add('selected');
				}
				saveSelections();
				updateWeekCounts();
			}

			function handlePosterClick(el, movie, shows, posterKey, week) {
				if (planningMode) {
					togglePosterSelection(el, posterKey, week);
				} else {
					openMovie(movie, shows);
				}
			}

			const seatmapCache = {};

			// Renders a seatmap JSON payload of the form:
			// { og_title, seats: [{available, column, row, name, type, seatTier, shouldDisplay}, ...], sold_out, theatre_id, showtime_date }
			// into the same .seatmap/.seat-row/.seat markup the CSS above already styles.
			function renderSeatmap(data) {
				const seats = (data && data.seats) || [];
				if (seats.length === 0) return '';

				const byRow = {};
				for (const seat of seats) {
					(byRow[seat.row] = byRow[seat.row] || []).push(seat);
				}

				const rowNumbers = Object.keys(byRow).map(Number).sort((a, b) => a - b);

				const rowsHtml = rowNumbers.map(rowNum => {
					const rowLabel = String.fromCharCode(64 + rowNum); // 1 -> A, 2 -> B, ...
					const seatsHtml = byRow[rowNum]
						.slice()
						.sort((a, b) => a.column - b.column)
						.map(seat => {
							if (!seat.shouldDisplay) return `<span class="seat seat--empty"></span>`;
							const cls = seat.available ? 'seat--available' : 'seat--booked';
							const title = seat.type && seat.type !== 'CanReserve' ? `${seat.name} (${seat.type})` : seat.name;
							return `<span class="seat ${cls}" title="${title}"></span>`;
						})
						.join('');
					return `<div class="seat-row"><span class="row-label">${rowLabel}</span>${seatsHtml}</div>`;
				}).join('');

				return `<div class="seatmap">
					<div class="seat-rows">${rowsHtml}</div>
					<div class="seat-legend"><span class="seat seat--available"></span> Available &nbsp; <span class="seat seat--booked"></span> Taken</div>
				</div>`;
			}

			function getCachedSeatmap(showId, callback) {
				const cached = seatmapCache[showId];
				if(cached && Date.now() - cached.time < 300000) {
					callback(cached.data);
					return;
				}
				const proxyUrl = `https://amc-backend-nkwj3n3oga-ue.a.run.app/seats?showtime_id=${showId}`; // PLACEHOLDER - I WILL REPLACE
				fetch(proxyUrl)
					.then(r=>r.json())
					.then(seatmapData => {
						seatmapCache[showId] = { data: seatmapData, time: Date.now() };
						callback(seatmapData);
					})
					.catch(e=>console.log('Seatmap fetch failed'));
			}

			// Attributes come from AMC as noisy, sometimes-duplicated strings
			// ("NoTrailers" vs "No Trailers", multiple recliner tiers, etc).
			// Normalize into a small set of useful, human-friendly filter tags
			// and drop administrative ones (discount exclusions, ID checks, etc).
			const ATTRIBUTE_BLOCKLIST = new Set([
				// 'Reserved Seating',
				'Pay with Disney Rewards Redemption Card',
				'Excluded from 50% off Discount',
				// 'Excluded from A-List',
				'No Passes',
				'ID Required',
				'Alternative Content',
				// 'RealD 3D',
				// '70mm',
				// 'PRIME at AMC',
				// 'IMAX at AMC',
			]);

			const ATTRIBUTE_ALIASES = {
				'Closed Caption': 'Closed Captions',
				'AMC Signature Recliners': 'Recliners',
				'Heated AMC Signature Recliners': 'Recliners',
				'Dine-In Delivery to Seat': 'Dine-In Delivery',
				'AMC Artisan Films': 'Artisan Films',
				'Event': 'Special Event',
				'NoTrailers': 'No Trailers',
				'Open Caption (On-screen Subtitles)': 'On-Screen Subtitles',
				'English Language Dubbed with No Subtitles': 'Dubbed',
				'Spanish Language Dubbed with No Subtitles': 'Dubbed',
			};

			function normalizeAttribute(raw) {
				if (!raw || ATTRIBUTE_BLOCKLIST.has(raw)) return null;
				if (ATTRIBUTE_ALIASES[raw]) return ATTRIBUTE_ALIASES[raw];
				if (/spoken with no subtitles/i.test(raw)) return 'Foreign Language (No Subtitles)';
				if (/spoken with .*subtitles/i.test(raw)) return 'Subtitled (Foreign Language)';
				return raw;
			}

			function showAttributes(show) {
				const set = new Set();
				for (const raw of show.attributes || []) {
					const norm = normalizeAttribute(raw);
					if (norm) set.add(norm);
				}
				return Array.from(set);
			}

			// Adds a dashed "All" toggle to a filter group: click once to select every
			// button in the group, click again to clear them all.
			function addSelectAllToggle(group, selector) {
				const allBtn = document.createElement('button');
				allBtn.className = 'filter-btn filter-select-all';
				allBtn.textContent = 'All';
				allBtn.onclick = () => {
					const btns = Array.from(group.querySelectorAll(selector));
					const allActive = btns.every(b => b.classList.contains('active'));
					btns.forEach(b => b.classList.toggle('active', !allActive));
					applyFilters();
				};
				group.appendChild(allBtn);
			}

			function buildFilters(movies) {
				const formatsSet = new Set();
				const theatersSet = new Set();
				const attrsSet = new Set();
				const screenWidths = [];
				for (const movie of movies) {
					for (const show of movie.showtimes || []) {
						formatsSet.add(show.premium_format || 'Standard');
						theatersSet.add(show.theater || show.theatre || 'Unknown');
						for (const a of showAttributes(show)) attrsSet.add(a);
						if (typeof show.screen_width_ft === 'number') screenWidths.push(show.screen_width_ft);
					}
				}
				
				const filtersDiv = document.getElementById('filters');
				filtersDiv.innerHTML = '';

				const formatGroup = document.createElement('div');
				formatGroup.className = 'filter-group';
				const formatLabel = document.createElement('span');
				formatLabel.className = 'filter-label';
				formatLabel.textContent = 'Format';
				formatGroup.appendChild(formatLabel);
				addSelectAllToggle(formatGroup, '[data-format]');

				Array.from(formatsSet).sort().forEach(format => {
					const btn = document.createElement('button');
					btn.className = 'filter-btn active';
					btn.textContent = format;
					btn.dataset.format = format;
					btn.onclick = () => {
						btn.classList.toggle('active');
						applyFilters();
					};
					formatGroup.appendChild(btn);
				});

				const theaterGroup = document.createElement('div');
				theaterGroup.className = 'filter-group';
				const theaterLabel = document.createElement('span');
				theaterLabel.className = 'filter-label';
				theaterLabel.textContent = 'Theater';
				theaterGroup.appendChild(theaterLabel);
				addSelectAllToggle(theaterGroup, '[data-theater]');

				Array.from(theatersSet).sort().forEach(theater => {
					const btn = document.createElement('button');
					btn.className = 'filter-btn active';
					btn.textContent = theater;
					btn.dataset.theater = theater;
					btn.onclick = () => {
						btn.classList.toggle('active');
						applyFilters();
					};
					theaterGroup.appendChild(btn);
				});

				const attributeGroup = document.createElement('div');
				attributeGroup.className = 'filter-group';
				const attributeLabel = document.createElement('span');
				attributeLabel.className = 'filter-label';
				attributeLabel.textContent = 'Attributes';
				attributeGroup.appendChild(attributeLabel);
				addSelectAllToggle(attributeGroup, '[data-attribute]');

				// Attribute buttons start inactive: with none selected, no attribute
				// filtering is applied. Selecting one or more narrows to showtimes
				// that have at least one of the selected attributes.
				Array.from(attrsSet).sort().forEach(attr => {
					const btn = document.createElement('button');
					btn.className = 'filter-btn';
					btn.textContent = attr;
					btn.dataset.attribute = attr;
					btn.onclick = () => {
						btn.classList.toggle('active');
						applyFilters();
					};
					attributeGroup.appendChild(btn);
				});

				filtersDiv.appendChild(formatGroup);
				filtersDiv.appendChild(theaterGroup);
				filtersDiv.appendChild(attributeGroup);

				if (screenWidths.length > 0) {
					const minWidth = Math.floor(Math.min(...screenWidths));
					const maxWidth = Math.ceil(Math.max(...screenWidths));

					const screenGroup = document.createElement('div');
					screenGroup.className = 'filter-group';
					const screenLabel = document.createElement('span');
					screenLabel.className = 'filter-label';
					screenLabel.textContent = 'Screen';
					screenGroup.appendChild(screenLabel);

					const slider = document.createElement('input');
					slider.type = 'range';
					slider.className = 'filter-slider';
					slider.id = 'screenSizeSlider';
					slider.min = minWidth;
					slider.max = maxWidth;
					slider.step = 1;
					slider.value = minWidth;
					slider.dataset.minWidth = minWidth;

					const valueLabel = document.createElement('span');
					valueLabel.className = 'filter-slider-value';
					valueLabel.id = 'screenSizeValue';
					valueLabel.textContent = 'Any (est.)';

					slider.oninput = () => {
						const v = Number(slider.value);
						valueLabel.textContent = v <= minWidth ? 'Any (est.)' : `≥ ${v}' (est.)`;
						applyFilters();
					};

					screenGroup.appendChild(slider);
					screenGroup.appendChild(valueLabel);
					filtersDiv.appendChild(screenGroup);
				}
			}

			function getMinScreenWidth() {
				const slider = document.getElementById('screenSizeSlider');
				if (!slider) return 0;
				const v = Number(slider.value);
				return v <= Number(slider.dataset.minWidth) ? 0 : v;
			}

			function applyFilters() {
				const activeFormats = new Set();
				document.querySelectorAll('.filter-btn.active[data-format]').forEach(btn => activeFormats.add(btn.dataset.format));
				const activeTheaters = new Set();
				document.querySelectorAll('.filter-btn.active[data-theater]').forEach(btn => activeTheaters.add(btn.dataset.theater));
				const activeAttributes = new Set();
				document.querySelectorAll('.filter-btn.active[data-attribute]').forEach(btn => activeAttributes.add(btn.dataset.attribute));
				const minScreenWidth = getMinScreenWidth();

				document.querySelectorAll('[data-formats]').forEach(el => {
					const formats = JSON.parse(el.dataset.formats);
					const theaters = JSON.parse(el.dataset.theaters || '[]');
					const attributes = JSON.parse(el.dataset.attributes || '[]');
					// Showtimes with no known screen width (null) always pass --
					// missing data shouldn't make a movie disappear from view.
					const screens = JSON.parse(el.dataset.screenWidths || '[]');
					const formatMatch = formats.some(f => activeFormats.has(f));
					const theaterMatch = theaters.some(t => activeTheaters.has(t));
					const attributeMatch = activeAttributes.size === 0 || attributes.some(a => activeAttributes.has(a));
					const screenMatch = minScreenWidth === 0 || screens.some(w => w === null || w >= minScreenWidth);
					el.style.display = (formatMatch && theaterMatch && attributeMatch && screenMatch) ? 'block' : 'none';
				});
			}

			async function load() {
				STATUS.textContent = 'Loading...';

				try {
					const res = await fetch('./movies.json');
					const data = await res.json();

					allMovies = data.movies || []; // Change this line

					// Build day -> movieKey -> { movie, shows }
					const days = {};

					for (const movie of allMovies) {
						for (const show of movie.showtimes || []) {
							const date = (show.datetime || '').slice(0, 10);
							if (!date) continue;
							days[date] = days[date] || {};
							const key = movieKey(movie);
							days[date][key] = days[date][key] || { movie, shows: [] };
							days[date][key].shows.push(show);
						}
					}

					render(days);
					buildFilters(allMovies); // Change this line
					STATUS.textContent = `${data.metadata?.showtime_count || 0} showtimes, ${data.metadata?.movie_count || allMovies.length} movies`;
					LAST_UPDATED.textContent = formatLastUpdated(data.metadata?.generated_at);

				} catch (err) {
					console.error(err);
					STATUS.textContent = 'Failed to load movies.json';
				}
			}

			function render(days) {
				GRID.innerHTML = '';
				posterWeekMap = {};

				const sortedDates = Object.keys(days).sort();
				if(sortedDates.length === 0) return;

				const firstDate = new Date(sortedDates[0] + 'T12:00:00');
				const lastDate = new Date(sortedDates[sortedDates.length - 1] + 'T12:00:00');

				// Find the most recent Friday on or before the first date
				const dayOfWeek = firstDate.getDay();
				const daysUntilFriday = (dayOfWeek === 5) ? 0 : (dayOfWeek > 5) ? dayOfWeek - 5 : dayOfWeek + 2;
				const startDate = new Date(firstDate);
				startDate.setDate(startDate.getDate() - daysUntilFriday);

				// Generate all dates from start Friday to end date
				const allDates = [];
				let current = new Date(startDate);
				while(current <= lastDate) {
					const dateStr = current.toISOString().slice(0, 10);
					allDates.push(dateStr);
					current.setDate(current.getDate() + 1);
				}

				// Render in rows of 7
				for(let i = 0; i < allDates.length; i += 7) {
					const week = allDates.slice(i, i + 7);
					const weekIndex = i / 7;
					
					for(const d of week) {
						const cell = document.createElement('div');
						cell.className = 'day';
						const dateObj = new Date(d + 'T12:00:00');
						cell.innerHTML = `<div class="date">${dateObj.toDateString()} <span class="week-count" data-week="${weekIndex}"></span></div><div class="posters"></div>`;
						const posters = cell.querySelector('.posters');

						if(days[d]) {
							const sortedEntries = Object.values(days[d]).sort((a, b) => b.shows.length - a.shows.length);

							for (const entry of sortedEntries) {
								const movie = entry.movie;
								const shows = entry.shows;

								const hasPoster = movie.poster && movie.poster !== 'None' && movie.poster !== 'null';

								const formats = JSON.stringify(shows.map(s => s.premium_format || 'Standard'));
								const theaters = JSON.stringify(shows.map(s => s.theater || s.theatre || 'Unknown'));
								const attributes = JSON.stringify(Array.from(new Set(shows.flatMap(s => showAttributes(s)))));
								const screenWidths = JSON.stringify(shows.map(s => typeof s.screen_width_ft === 'number' ? s.screen_width_ft : null));
								const posterKey = `${d}::${movieKey(movie)}`;
								posterWeekMap[posterKey] = weekIndex;
								const isSelected = selectedPosters.has(posterKey);

								let el;
								if (hasPoster) {
									el = document.createElement('img');
									el.className = 'poster' + (isSelected ? ' selected' : '');
									el.src = movie.poster;
									el.alt = movie.title;
									el.dataset.formats = formats;
									el.dataset.theaters = theaters;
									el.dataset.attributes = attributes;
									el.dataset.screenWidths = screenWidths;
									el.dataset.posterKey = posterKey;
									el.dataset.week = weekIndex;
									el.onerror = () => {
										const f = document.createElement('div');
										f.className = 'poster poster-fallback' + (isSelected ? ' selected' : '');
										f.textContent = movie.title;
										f.title = movie.title;
										f.dataset.formats = formats;
										f.dataset.theaters = theaters;
										f.dataset.attributes = attributes;
										f.dataset.screenWidths = screenWidths;
										f.dataset.posterKey = posterKey;
										f.dataset.week = weekIndex;
										f.onclick = () => handlePosterClick(f, movie, shows, posterKey, weekIndex);
										el.replaceWith(f);
									};
								} else {
									el = document.createElement('div');
									el.className = 'poster poster-fallback' + (isSelected ? ' selected' : '');
									el.textContent = movie.title;
									el.title = movie.title;
									el.dataset.formats = formats;
									el.dataset.theaters = theaters;
									el.dataset.attributes = attributes;
									el.dataset.screenWidths = screenWidths;
									el.dataset.posterKey = posterKey;
									el.dataset.week = weekIndex;
								}

								el.onclick = () => handlePosterClick(el, movie, shows, posterKey, weekIndex);
								posters.appendChild(el);
							}
						}

						GRID.appendChild(cell);
					}
				}

				GRID.classList.toggle('planning-mode', planningMode);
				updateWeekCounts();
			}
			function openMovie(movie, shows) {
				// Group shows by theater
				const groups = {};
				for (const s of shows) {
					const t = s.theater || s.theatre || 'Unknown';
					groups[t] = groups[t] || [];
					groups[t].push(s);
				}

				const posterHtml = movie.poster ? `<img style="width:220px;border-radius:6px" src="${movie.poster}" alt="${movie.title}">` : `<div class='poster poster-fallback' style='width:220px;height:330px'>${movie.title}</div>`;

				CONTENT.innerHTML = `
					<div>${posterHtml}</div>
					<div>
						<button onclick="closeModal()" style="float:right">✕</button>
						<h1>${movie.title}</h1>
						<div>
							<span class="badge">${movie.imdb_rating || ''} IMDb</span>
							${movie.letterboxd_rating ? `<span class="badge">${movie.letterboxd_url ? `<a href="${movie.letterboxd_url}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${movie.letterboxd_rating.toFixed(2)} ★ Letterboxd</a>` : `${movie.letterboxd_rating.toFixed(2)} ★ Letterboxd`}</span>` : ''}
							<span class="badge">${movie.release_year || ''}</span>
							<span class="badge">${(movie.genres || []).join(', ')}</span>
						</div>
						<p><small>${movie.plot || movie.short_description || ''}</small></p>
						<h2>Showtimes</h2>
						${Object.entries(groups).map(([theater, list]) => `
							<div class="theater-group" data-theater="${theater}">
							<h3>${theater}</h3>
							${list.map(s => {
								const time = new Date(s.datetime).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
								const fmt = s.premium_format || 'Standard';
								// Encode attributes for use in data-attrs
								const attrs = (s.attributes || []).join(', ');
								const prices = (s.ticket_prices || []).map(p=>`${p.type}: $${p.price}`).join(', ');
								const isAmc = (s.theater || s.theatre || '').includes('AMC');
								const normAttrs = JSON.stringify(showAttributes(s));
								const screenWidth = s.screen_width_ft ? ` · ~${s.screen_width_ft}' screen` : '';

								return `<div><span class="show-badge ${s.sold_out? 'sold':''}" ${isAmc ? `data-show-id="${s.showtime_id||s.id}"` : ''} data-datetime="${s.datetime}" data-format="${fmt}" data-auditorium="${s.auditorium||''}" data-sold="${s.sold_out}" data-almost="${s.almost_sold_out}" data-cancelled="${s.cancelled}" data-attrs="${attrs}" data-normalized-attrs='${normAttrs}' data-prices="${prices}" data-screen-width="${s.screen_width_ft||''}">${time} · ${fmt}${screenWidth}</span></div>`;
							}).join('')}
							</div>
						`).join('')}
						<hr>
						<p><b>Directors:</b> ${(movie.directors || []).join(', ')}<br><b>Cast:</b> ${(movie.actors || []).join(', ')}</p>
					</div>`;

				MODAL.style.display = 'flex';

				// Apply current filters to modal showtimes
				const activeFormats = new Set();
				document.querySelectorAll('.filter-btn.active[data-format]').forEach(btn => activeFormats.add(btn.dataset.format));
				const activeTheaters = new Set();
				document.querySelectorAll('.filter-btn.active[data-theater]').forEach(btn => activeTheaters.add(btn.dataset.theater));
				const activeAttributes = new Set();
				document.querySelectorAll('.filter-btn.active[data-attribute]').forEach(btn => activeAttributes.add(btn.dataset.attribute));
				document.querySelectorAll('.theater-group').forEach(group => {
					group.style.display = activeTheaters.has(group.dataset.theater) ? '' : 'none';
				});
				const minScreenWidth = getMinScreenWidth();
				document.querySelectorAll('.show-badge').forEach(badge => {
					const fmt = badge.getAttribute('data-format') || 'Standard';
					const badgeAttrs = JSON.parse(badge.getAttribute('data-normalized-attrs') || '[]');
					const attributeMatch = activeAttributes.size === 0 || badgeAttrs.some(a => activeAttributes.has(a));
					const widthAttr = badge.getAttribute('data-screen-width');
					const width = widthAttr ? Number(widthAttr) : null;
					const screenMatch = minScreenWidth === 0 || width === null || width >= minScreenWidth;
					badge.style.display = (activeFormats.has(fmt) && attributeMatch && screenMatch) ? 'inline-block' : 'none';
				});

				// Attach hover / click handlers to showtime badges
				const tooltip = document.createElement('div');
				tooltip.className = 'show-tooltip';
				tooltip.style.display = 'none';
				document.body.appendChild(tooltip);

				function showTooltip(el) {
					const dt = el.getAttribute('data-datetime') || '';
					const fmt = el.getAttribute('data-format') || '';
					const showId = el.getAttribute('data-show-id');
					const aud = el.getAttribute('data-auditorium') || '';
					const sold = el.getAttribute('data-sold') === 'true';
					const almost = el.getAttribute('data-almost') === 'true';
					const cancelled = el.getAttribute('data-cancelled') === 'true';
					const attrs = el.getAttribute('data-attrs') || '';
					const prices = el.getAttribute('data-prices') || '';

					let html = `<div><b>${new Date(dt).toLocaleString()}</b></div>
						<div style="margin-top:6px"><b>Format:</b> ${fmt}</div>
						${aud? `<div><b>Auditorium:</b> ${aud}</div>`: ''}
						${prices? `<div><b>Prices:</b> ${prices}</div>`: ''}
						${attrs? `<div><b>Attributes:</b> ${attrs}</div>`: ''}
						${sold? `<div style="color:#faa"><b>Sold out</b></div>`: (almost? `<div style="color:#ffb"><b>Almost sold out</b></div>`: '')}
						${cancelled? `<div style="color:#888"><b>Cancelled</b></div>`: ''}`;

					tooltip.innerHTML = html;
					tooltip.style.display = 'block';

					if(showId && !sold && !cancelled) {
						if(!el.dataset.seatmapFetched) {
							el.dataset.seatmapFetched = 'true';
							getCachedSeatmap(showId, (seatmapData) => {
								const cleaned = renderSeatmap(seatmapData);
								el.dataset.seatmapHtml = cleaned;
								if (cleaned) {
									tooltip.innerHTML += `<div style="margin-top:8px;border-top:1px solid #444;padding-top:8px">${cleaned}</div>`;
								}
								positionTooltip(el);
							});
						} else {
							tooltip.innerHTML += `<div style="margin-top:8px;border-top:1px solid #444;padding-top:8px">${el.dataset.seatmapHtml}</div>`;
							positionTooltip(el);
						}
					} else {
						positionTooltip(el);
					}
				}

				function positionTooltip(el) {
					const r = el.getBoundingClientRect();
					const tooltipHeight = tooltip.offsetHeight;
					let top = window.scrollY + r.bottom + 8;
					
					if(top + tooltipHeight > window.innerHeight + window.scrollY) {
						top = window.scrollY + r.top - tooltipHeight - 8;
					}
					
					tooltip.style.left = Math.min(window.innerWidth - 420, Math.max(8, r.left)) + 'px';
					tooltip.style.top = top + 'px';
				}
				function hideTooltip() {
					tooltip.style.display = 'none';
				}

				document.querySelectorAll('.show-badge').forEach(b => {
					b.addEventListener('mouseenter', () => showTooltip(b));
					b.addEventListener('mouseleave', hideTooltip);
					b.addEventListener('click', (ev) => { ev.stopPropagation(); showTooltip(b); });
				});

				// Hide tooltip when clicking outside
				document.addEventListener('click', hideTooltip);
			}

			// Auto-load on page open
			load();
		</script>
	</body>
</html>
