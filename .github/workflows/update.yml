name: Update movies.json

on:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pages-webapp/requirements.txt

      - name: Run fetch script
        env:
          AMC_API_KEY: ${{ secrets.AMC_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: |
          python pages-webapp/fetch_movies.py

      - name: Commit generated assets
        uses: EndBug/add-and-commit@v9
        with:
          author_name: github-actions
          author_email: actions@github.com
          message: "chore: update generated movies.json and posters"
          add: "pages-webapp/docs/**"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
