name: Update movies.json

on:
  schedule:
    # Runs 4 times a day at 04:00, 10:00, 16:00, and 22:00 UTC
    # In CST (UTC-6), this corresponds to: 10:00 PM, 4:00 AM, 10:00 AM, and 4:00 PM
    - cron: '0 4,10,16,22 * * *'
  workflow_dispatch: {}

# Allow the workflow to push changes to the repository
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # ensure the runner has credentials to push changes
          persist-credentials: true
          # fetch full history to avoid shallow clone issues when pushing
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fetch script
        env:
          AMC_API_KEY: ${{ secrets.AMC_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: |
          python fetch_movies.py

      - name: Commit generated assets
        uses: EndBug/add-and-commit@v9
        with:
          author_name: github-actions
          author_email: actions@github.com
          message: "chore: update generated movies.json and posters"
          add: "docs/**"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # allow older Node runtime usage if action requires it
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
